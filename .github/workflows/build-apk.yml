name: Build Android APK

# O APK é um WebView do Capacitor apontando para a produção na Vercel.
# Por isso o build só precisa rodar quando o projeto Android, a configuração
# do Capacitor ou os assets locais mudarem. Use "Run workflow" para gerar
# uma nova versão sob demanda.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O runner ubuntu-latest já traz o Android SDK e o sdkmanager. Não use
      # android-actions/setup-android@v3: ele tenta instalar o pacote "tools",
      # removido dos repositórios recentes, e falha com "Failed to find package".
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk velo.apk
          ls -lh velo.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: velo-apk
          path: velo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          APK de debug (sideload) gerado automaticamente a partir do commit ${{ github.sha }}.

          - **Baixar:** `velo.apk` (asset abaixo)
          - **Link direto:** https://github.com/${{ github.repository }}/releases/latest/download/velo.apk
          - **Assinatura:** debug — instale com "instalar apps desconhecidos" habilitado.
          - **Conteúdo:** WebView do Capacitor apontando para https://velo-iota-bice.vercel.app

          Como a assinatura de debug muda entre builds, versões futuras podem exigir desinstalar a anterior antes de instalar por cima.
          EOF

          # Atualiza a release no lugar em vez de apagar/recriar: o link
          # /releases/latest/download/velo.apk nunca fica indisponível.
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest \
              --title "velo. APK — build ${{ github.run_number }}" \
              --notes-file release-notes.md \
              --latest
            gh release upload apk-latest velo.apk --clobber
          else
            gh release create apk-latest velo.apk \
              --title "velo. APK — build ${{ github.run_number }}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Summary
        run: |
          {
            echo "### APK pronto"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Download direto: https://github.com/${{ github.repository }}/releases/latest/download/velo.apk"
            echo "- Artifact: \`velo-apk\` (aba Actions deste run)"
          } >> "$GITHUB_STEP_SUMMARY"
