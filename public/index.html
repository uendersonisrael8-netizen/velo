<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>velo.</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f4f1ea;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      .mark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.06em;
      }
      .dot {
        color: #ff4d1c;
      }
      p {
        margin: 18px 0 0;
        color: #98938a;
        font-size: 13px;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        padding: 13px 22px;
        border-radius: 999px;
        background: #ff4d1c;
        color: #0a0a0a;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">velo<span class="dot">.</span></div>
      <p>
        Não foi possível carregar o feed agora. Verifique sua conexão e tente
        novamente.
      </p>
      <a href="https://velo-iota-bice.vercel.app/">abrir o velo</a>
    </main>
  </body>
</html>
